spring.application.name=reservations-springboot

spring.datasource.url = jdbc:mysql://localhost:3306/reservations?autoreconnect = true&useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false&allowPublicKeyRetrieval=true
spring.datasource.username = root
spring.datasource.password = Informatique1@
spring.datasource.tomcat.testOnBorrow = true

# Affiche les requêtes SQL dans la console (pratique pour le débogage)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 1. Désactiver la création automatique de Hibernate pour laisser la main à Flyway
spring.jpa.hibernate.ddl-auto=none

# 2. Activer explicitement Flyway (activé par défaut si le starter est présent)
spring.flyway.enabled=true

# 3. Permettre l'initialisation si votre base de données contient déjà des tables
spring.flyway.baseline-on-migrate=true